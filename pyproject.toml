[project]
name = "pysnapping"
description = "Snap points to a line string keeping a given order or spacing intact"
readme = "README.md"
dependencies = [
  "shapely",
  "numpy~=2.0",  # for vectorized operations
  "pyproj>=3.2.0",  # for defining custom CRS
]
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Alexander Held | geOps", email = "alexander.held@geops.com"}]
maintainers = [{name = "Alexander Held | geOps", email = "alexander.held@geops.com"}]
keywords = [
  "snapping",
  "projecting",
  "linear referencing",
  "order",
  "linestring",
  "GIS",
  "GTFS",
  "kilometrage",
  "DAG",
  "shortest path",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
    "mypy",
]

[project.urls]
homepage = "https://github.com/geops/pysnapping"
geOps = "https://geops.com/en"

[build-system]
requires = ["setuptools>=61", "setuptools_scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["pysnapping", "pysnapping.*"]

[tool.uv]
cache-keys = [
    # default
    { file = "pyproject.toml"},
    # for non-editable installs (dynamic setuptools_scm versioning)
    { git = { commit = true } },
]
environments = ["sys_platform == 'linux'"]

[tool.ruff.lint]
select = [
    "F", # pyflakes
    "E",  # pycodestyle
    "W", # pycodestyle
    "UP",  # pyupgrade
    "C901",  # mccabe
    "YTT",  # no sys.version tuple comparisons
    "ASYNC",  # no obviously blocking io in corotine
    "G",  #  flake8-logging-format
    "PIE",  # unnecessary statements
    "SLOT",   # str, tuple, namedtuple subclasses need __slots__
    "FIX003",  # line contains XXX
    "NPY201",  # numpy 2.0 deprecations
    "SIM",  # flake8-simplify
    "I",  # sort imports
    "T100",  # breakpoints
]
ignore = [
    "E501",  # line too long
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
ignore_missing_imports = true
# If we allow to install types, mypy will use pip to alter the venv with unpinned extra
# type stubs. We are on a pure uv setup and don't have pip. Also we want everything
# pinned. Thus all missing type stubs have to go to dev dependencies.
install_types = false
non_interactive = false

[tool.pytest]

[tool.coverage.run]
branch = true
source = [
    "pysnapping"
]
omit = [
    "pysnapping/test/*",
]
