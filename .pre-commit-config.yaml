fail_fast: true
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: no-commit-to-branch
    - id: check-merge-conflict
    - id: check-symlinks
    - id: mixed-line-ending
      args: ['--fix=no']
    - id: check-ast
    - id: check-builtin-literals
    - id: check-case-conflict
    - id: check-docstring-first
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.4
  hooks:
    - id: ruff
      args: [ --fix ]
    - id: ruff-format
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.13.7
  hooks:
    - id: uv-lock
      files: ^pyproject.toml|uv.lock$
- repo: local
  hooks:
    - id: mypy
      name: mypy
      # gitlab job syncs explicitly without building extensions
      # and for local dev we assume synced
      entry: uv run --no-sync mypy
      # We need installed dependencies for mypy, so we can't use an isolated env. This
      # could be fixed by using ty instead which is capable of resolving dependencies on
      # its own (mypy and pyright can't do that).
      language: system
      # don't pass file names, so we detect errors in B when only A changed but B
      # imports A
      pass_filenames: false
      # always run instead of a python file filter, so we detect errors in B when A gets
      # deleted but B imports A
      always_run: true
      args: ["-p", "pysnapping"]
